
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#2563eb">

    <title>
        Students Homework AI
        | Class 6–10
    </title>

    <meta
        name="description"
        content="Students Homework AI helps CBSE Class 6–10 students solve homework, understand concepts and prepare for exams.">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div id="app">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <header class="app-header">

            <h1>
                Students Homework AI
            </h1>

            <p>
                Class 6–10 Homework Help
            </p>

        </header>

        <!-- ========================= -->
        <!-- WELCOME SCREEN -->
        <!-- ========================= -->

        <section
            id="welcomeScreen"
            class="screen active">

            <div class="card">

                <h2>
                    Welcome
                </h2>

                <p>
                    Solve homework with AI,
                    understand concepts and
                    prepare for exams.
                </p>

                <button
                    id="startTrialBtn"
                    onclick="showRegistration()">

                    Start Your
                    7-Day Free Trial

                </button>

                <button
                    id="loginBtn"
                    onclick="showLogin()">

                    Student Login

                </button>

            </div>

        </section>

        <!-- ========================= -->
        <!-- REGISTRATION SCREEN -->
        <!-- ========================= -->

        <section
            id="registrationScreen"
            class="screen">

            <div class="card">

                <h2>
                    Student Registration
                </h2>

                <form
                    id="registrationForm"
                    onsubmit="registerStudent(); return false;">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        required>

                    <label>
                        Class
                    </label>

                    <select
                        id="studentClass"
                        required>

                        <option value="">
                            Select Class
                        </option>

                        <option>
                            Class 6
                        </option>

                        <option>
                            Class 7
                        </option>

                        <option>
                            Class 8
                        </option>

                        <option>
                            Class 9
                        </option>

                        <option>
                            Class 10
                        </option>
                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="studentMobile"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        required>

                    <label>
                        Parent Mobile
                        (Optional)
                    </label>

                    <input
                        type="tel"
                        id="parentMobile"
                        placeholder="Parent mobile number"
                        maxlength="10">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter email address"
                        required>

                    <button
                        type="submit"
                        id="registerButton">

                        Register &
                        Start Free Trial

                    </button>

                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="showWelcome()">

                        Back

                    </button>

                </form>

            </div>

        </section>

        <!-- ========================= -->
        <!-- LOGIN SCREEN -->
        <!-- ========================= -->

        <section
            id="loginScreen"
            class="screen">

            <div class="card">

                <h2>
                    Student Login
                </h2>

                <form
                    id="loginForm"
                    onsubmit="loginStudent(); return false;">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="loginMobile"
                        placeholder="Registered mobile number"
                        maxlength="10"
                        required>

                    <button
                        type="submit">

                        Login

                    </button>

                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="showWelcome()">

                        Back

                    </button>

                </form>

            </div>

        </section>

                <!-- ========================= -->
        <!-- DASHBOARD SCREEN -->
        <!-- ========================= -->

        <section
            id="dashboardScreen"
            class="screen">

            <div class="card">

                <h2>
                    Welcome,
                    <span id="studentDisplayName">
                        Student
                    </span>
                </h2>

                <p>
                    Select your class to continue.
                </p>

                <div
                    id="classButtons"
                    class="grid-buttons">

                    <button
                        onclick="showSubject('Class 6')">
                        Class 6
                    </button>

                    <button
                        onclick="showSubject('Class 7')">
                        Class 7
                    </button>

                    <button
                        onclick="showSubject('Class 8')">
                        Class 8
                    </button>

                    <button
                        onclick="showSubject('Class 9')">
                        Class 9
                    </button>

                    <button
                        onclick="showSubject('Class 10')">
                        Class 10
                    </button>

                </div>

                <button
                    class="secondary-btn"
                    onclick="logoutStudent()">

                    Logout

                </button>

            </div>

        </section>

        <!-- ========================= -->
        <!-- SUBJECT SCREEN -->
        <!-- ========================= -->

        <section
            id="subjectScreen"
            class="screen">

            <div class="card">

                <h2
                    id="selectedClassTitle">

                    Class

                </h2>

                <div
                    class="grid-buttons">

                    <button
                        onclick="selectSubject('Mathematics')">

                        Mathematics

                    </button>

                    <button
                        onclick="selectSubject('Science')">

                        Science

                    </button>

                    <button
                        onclick="selectSubject('English')">

                        English

                    </button>

                    <button
                        onclick="selectSubject('Social Science')">

                        Social Science

                    </button>

                </div>

                <button
                    class="secondary-btn"
                    onclick="showDashboard()">

                    Back

                </button>

            </div>

        </section>
        <!-- ========================= -->
        <!-- AI HOMEWORK SCREEN -->
        <!-- ========================= -->

        <section
            id="aiScreen"
            class="screen">

            <div class="card">

                <h2>
                    Students Homework AI
                </h2>

                <p id="selectedSubject">
                    Subject
                </p>

                <textarea
                    id="questionInput"
                    rows="6"
                    placeholder="Type your homework question here..."></textarea>

                <button
                    onclick="askAI()">

                    Get AI Answer

                </button>

                <button
                    class="secondary-btn"
                    onclick="showSubject()">

                    Back

                </button>

                <div
                    id="loadingBox"
                    class="loading"
                    style="display:none;">

                    AI is thinking...

                </div>

                <div
                    id="answerBox"
                    class="answer-box">

                </div>

            </div>

        </section>

    </div>

    <!-- ========================= -->
    <!-- SUPABASE -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <!-- ========================= -->
    <!-- APPLICATION -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
        
                        

                    </select>
